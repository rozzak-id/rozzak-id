<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <!-- Neobrutalism slim banner: blue / yellow / white / red, thick black borders, hard shadows -->
  <defs>
    <style>
      .name { font-family: Arial, Helvetica, sans-serif; font-weight: 900; font-size: 48px; letter-spacing: 1px; }
      .tag  { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 3px; }
      .chip { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- hard shadow -->
  <rect x="16" y="16" width="1170" height="190" fill="#000000"/>
  <!-- main panel -->
  <rect x="8" y="8" width="1170" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>

  <!-- left color stripes -->
  <rect x="8" y="8" width="24" height="190" fill="#2563EB"/>
  <rect x="32" y="8" width="8" height="190" fill="#FACC15"/>

  <!-- vertical divider -->
  <rect x="700" y="34" width="4" height="138" fill="#000000"/>

  <!-- name -->
  <text x="72" y="98" class="name" fill="#000000">MUHAMMAD YUSRA</text>
  <text x="72" y="150" class="name" fill="#2563EB">ROZZAK ALFITRAH</text>

  <!-- yellow accent bar under name -->
  <rect x="72" y="162" width="300" height="8" fill="#FACC15" stroke="#000000" stroke-width="3"/>

  <!-- tagline -->
  <text x="72" y="192" class="tag" fill="#000000">STUDENT &#8226; WEB DEVELOPER &#8226; VIBE CODER</text>

  <!-- right chips stack -->
  <g>
    <!-- chip 1 -->
    <rect x="766" y="46" width="380" height="42" fill="#000000"/>
    <rect x="760" y="40" width="380" height="42" fill="#2563EB" stroke="#000000" stroke-width="4"/>
    <text x="950" y="67" class="chip" fill="#FFFFFF" text-anchor="middle">WHATSAPP BOT DEVELOPER</text>

    <!-- chip 2 -->
    <rect x="766" y="106" width="380" height="42" fill="#000000"/>
    <rect x="760" y="100" width="380" height="42" fill="#FACC15" stroke="#000000" stroke-width="4"/>
    <text x="950" y="127" class="chip" fill="#000000" text-anchor="middle">NODE.JS &amp; BAILEYS</text>

    <!-- chip 3 -->
    <rect x="766" y="166" width="380" height="42" fill="#000000"/>
    <rect x="760" y="160" width="380" height="42" fill="#EF4444" stroke="#000000" stroke-width="4"/>
    <text x="950" y="187" class="chip" fill="#FFFFFF" text-anchor="middle">WEBSITES &amp; APIS</text>
  </g>
</svg>
