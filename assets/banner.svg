<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" fill="none">
  <defs>
    <style>
      .text-title-black {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 33px;
        fill: #000000;
        letter-spacing: -0.5px;
      }
      .text-title-blue {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 33px;
        fill: #2563EB;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 12px;
        fill: #1F2937;
        letter-spacing: 1.5px;
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 13px;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Neo-brutalism Frame Shadow -->
  <rect x="14" y="14" width="824" height="196" rx="6" fill="#000000" />

  <!-- Main Card Container -->
  <rect x="6" y="6" width="824" height="196" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />

  <!-- Vertical Divider -->
  <line x1="530" y1="6" x2="530" y2="202" stroke="#000000" stroke-width="4" />

  <!-- LEFT SECTION -->
  <!-- Blue Accent Bar -->
  <rect x="28" y="30" width="8" height="148" rx="4" fill="#2563EB" />

  <!-- Titles -->
  <text x="52" y="74" class="text-title-black">MUHAMMAD YUSRA</text>
  <text x="52" y="114" class="text-title-blue">ROZZAK ALFITRAH</text>

  <!-- Subtitle Divider -->
  <line x1="52" y1="135" x2="505" y2="135" stroke="#000000" stroke-width="3" />

  <!-- Subtitle Text -->
  <text x="52" y="165" class="text-subtitle">STUDENT • WEB DEVELOPER • VIBE CODER</text>

  <!-- RIGHT SECTION (CHIPS) -->
  <!-- Chip 1: WhatsApp Bot Developer -->
  <g>
    <rect x="555" y="25" width="254" height="44" rx="4" fill="#000000" />
    <rect x="552" y="22" width="254" height="44" rx="4" fill="#2563EB" stroke="#000000" stroke-width="3" />
    <text x="679" y="44" class="chip-text" fill="#FFFFFF">WHATSAPP BOT DEVELOPER</text>
  </g>

  <!-- Chip 2: Node.js & Baileys -->
  <g>
    <rect x="555" y="85" width="254" height="44" rx="4" fill="#000000" />
    <rect x="552" y="82" width="254" height="44" rx="4" fill="#FFDE59" stroke="#000000" stroke-width="3" />
    <text x="679" y="104" class="chip-text" fill="#000000">NODE.JS &amp; BAILEYS</text>
  </g>

  <!-- Chip 3: Websites & APIs -->
  <g>
    <rect x="555" y="145" width="254" height="44" rx="4" fill="#000000" />
    <rect x="552" y="142" width="254" height="44" rx="4" fill="#FF4D4D" stroke="#000000" stroke-width="3" />
    <text x="679" y="164" class="chip-text" fill="#FFFFFF">WEBSITES &amp; APIS</text>
  </g>
</svg>
